[tox]
requires =
    tox-uv>=1.0
env_list =
    style
    test
isolated_build = true

[testenv]
runner = uv-venv-lock-runner
pass_env =
    FILE_MANAGER_AZURE_BLOB_CACHE_ENABLED

[testenv:style]
description = Run style and type checks
dependency_groups =
    dev
commands =
    ruff check
    ruff format --check
    # ty is pre-1.0; --exit-zero keeps type findings advisory so they don't gate CI.
    ty check --exit-zero

[testenv:test]
description = Run unit tests
dependency_groups =
    dev
commands =
    pytest --junitxml=.tox/.work_env/test-results.xml tests/
